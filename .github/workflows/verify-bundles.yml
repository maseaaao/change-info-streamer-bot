name: Validate and synchronize standalone Stream Info

on:
  push:
    branches:
      - feat/blue-ivory-redesign
    paths:
      - src/**
      - tests/**
      - package.json
      - scripts/**
      - .github/workflows/verify-bundles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit rebuilt standalone HTML files
        shell: bash
        run: |
          git add change-info-streamer-bot.html dist/change-info-streamer-bot.*.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: synchronize standalone Stream Info HTML files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
